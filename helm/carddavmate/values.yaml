replicaCount: 1

image:
  repository: carddavmate
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

# nginx's master runs as root in this image, workers drop to nginx.
podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 80
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: carddavmate.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

  # Prefixes stripped before the request reaches nginx, which serves from the
  # root. Set this to the path in `hosts` whenever that path is not `/`, or
  # every asset is a 404. The client's own URLs are relative, so the browser
  # keeps the prefix and Traefik takes it off each time. Traefik only.
  stripPrefixes: []
  #  - /carddavmate

  # Traefik CRD group. traefik.containo.us/v1alpha1 on Traefik v2.
  traefikApiVersion: traefik.io/v1alpha1
  # Middleware refs chained ahead of the chart's own.
  traefikMiddlewares: []

# Appended to the image's config.js at start-up, so everything not named here
# keeps the client's own default. It lands in the podspec, which means a change
# rolls the pods by itself.
config:
  # The CardDAV principal URL **without the user part**, e.g.
  # https://contacts.example.com/card.php/principals/ — a collection URL here
  # leaves the client reporting no address books at all.
  # Empty keeps the client's default, which builds a same-origin URL.
  href: ""
  hrefLabel: ""
  language: ""
  # Raw JavaScript, appended last. A syntax error takes the client down with a
  # blank page and nothing in the pod's logs.
  extraJs: ""

resources: {}

livenessProbe:
  httpGet:
    path: /index.html
    port: http
  initialDelaySeconds: 5
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /index.html
    port: http
  initialDelaySeconds: 2
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

extraEnv: []
